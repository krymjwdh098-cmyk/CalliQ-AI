name: Render Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy-notification:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deployment notification
        run: |
          echo "🚀 Code pushed to main branch!"
          echo ""
          echo "To deploy to Render:"
          echo "1. Go to https://dashboard.render.com"
          echo "2. Connect your GitHub repository"
          echo "3. Render will auto-deploy on push to main"
          echo ""
          echo "Services to deploy:"
          echo "- Backend API (Python)"
          echo "- Frontend (Static site)"
          echo ""
          echo "Environment variables needed:"
          echo "- GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}"
          echo "- GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}"
